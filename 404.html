<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>openOODA — not found</title>
  <meta name="description" content="Not found.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta property="og:title" content="openOODA — not found">
  <meta property="og:description" content="Not found.">
  <meta property="og:url" content="https://openooda.org/">
  <meta property="og:image" content="https://openooda.org/og.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <script>
    (function () {
      var m = document.cookie.match(/(?:^|; )ooda-theme=([^;]*)/);
      var t = (m && m[1] === "dark") || (typeof localStorage !== "undefined" && localStorage.getItem("ooda-theme") === "dark") ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <style>
    :root { --bg: #fff; --fg: #000; --muted: #444; }
    html[data-theme="dark"] { --bg: #000; --fg: #e8e8e8; --muted: #9a9a9a; }
    html { background: var(--bg); color: var(--fg); height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 16px;
      line-height: 1.5;
    }
    header {
      position: sticky; top: 0; z-index: 10; background: var(--bg);
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 0.75rem 1.25rem; padding: 0.85rem 1.25rem; border-bottom: 2px solid var(--fg);
    }
    .brand-row { display: flex; align-items: baseline; gap: 0.45rem; }
    .brand {
      font-weight: 700; letter-spacing: 0.08em; color: var(--bg);
      background: var(--fg); padding: 0.2rem 0.45rem; text-decoration: none; white-space: nowrap;
    }
    .ver { font-size: 0.85rem; white-space: nowrap; }
    #theme {
      font: inherit; background: var(--bg); color: var(--fg);
      border: 2px solid var(--fg); padding: 0.15rem 0.55rem; cursor: pointer; white-space: nowrap;
    }
    .wrap { display: grid; grid-template-columns: 12rem 1fr; max-width: 60rem; flex: 1 0 auto; }
    .col { display: flex; flex-direction: column; min-width: 0; }
    footer {
      flex: 0 0 auto;
      padding: 0.85rem 1.25rem;
      padding-bottom: calc(0.85rem + env(safe-area-inset-bottom, 0px));
      background: var(--bg);
      max-width: 44rem;
      box-sizing: border-box;
    }
    aside {
      border-right: 1px solid var(--fg); padding: 1.25rem 1rem 5rem;
      position: sticky; top: 3.4rem; align-self: start;
    }
    .global a { display: block; color: var(--fg); padding: 0.25rem 0; text-align: left; }
    main { padding: 1.5rem 1.25rem 1.5rem; max-width: 44rem; flex: 1 0 auto; }
    p { margin: 0 0 1.25rem; max-width: 36rem; }
    .mail {
      display: grid;
      grid-template-columns: minmax(0, 50ch) auto;
      justify-content: start;
      justify-items: stretch;
      align-items: center;
      column-gap: 0.75rem;
      row-gap: 0.55rem;
      margin: 0;
      width: max-content;
      max-width: 100%;
    }
    .mail input[type="email"] {
      font: inherit; background: var(--bg); color: var(--fg);
      border: 2px solid var(--fg); padding: 0.15rem 0.55rem;
      width: 100%; min-width: 0; box-sizing: border-box;
    }
    .mail #join {
      font: inherit; background: var(--bg); color: var(--fg);
      border: 2px solid var(--fg); padding: 0.15rem 0.55rem;
      cursor: pointer; white-space: nowrap; min-width: 6ch;
      text-align: center; box-sizing: content-box;
    }
    .mail #join.is-on { background: var(--fg); color: var(--bg); }
    .mail .hp {
      position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden;
    }
    .mail .note { margin: 0; font-size: 0.85rem; color: var(--muted); grid-column: 1 / -1; }
    a { color: var(--fg); }
    a:hover { text-decoration-thickness: 2px; }
    #gh { position: fixed; right: 1rem; bottom: 1rem; z-index: 20; color: var(--fg); background: var(--bg); padding: 0.15rem 0.35rem; }
    #skip {
      position: absolute; left: 0.5rem; top: 0.5rem; z-index: 30;
      background: var(--bg); color: var(--fg); padding: 0.15rem 0.45rem;
      clip-path: inset(50%); width: 1px; height: 1px; overflow: hidden;
    }
    #skip:focus {
      clip-path: none; width: auto; height: auto; overflow: visible;
      outline: 2px solid var(--fg);
    }
    @media (max-width: 800px) {
      .wrap { grid-template-columns: 1fr; }
      aside { position: static; border-right: 0; border-bottom: 1px solid var(--fg); padding-bottom: 1rem; }
      #gh {
        position: static; display: block;
        margin-top: 0.75rem; padding: 0.75rem 0 0;
        border-top: 1px solid var(--fg);
      }
      #theme, .mail #join, .mail input[type="email"] {
        min-height: 44px; padding: 0.55rem 0.85rem; box-sizing: border-box;
      }
      .global a {
        min-height: 44px; padding-top: 0.65rem; padding-bottom: 0.65rem; box-sizing: border-box;
      }
      .mail { grid-template-columns: minmax(0, 1fr); width: 100%; }
      .mail #join { justify-self: start; }
      main { padding-bottom: 1.5rem; }
    }
    @media print {
      html, body { background: #fff; color: #000; }
      #skip, #gh, #theme, footer, header, aside { display: none !important; }
      .wrap, .col { display: block; }
      main { padding: 0; }
      a { color: #000; }
    }
  </style>
</head>
<body>
  <a id="skip" href="/guide/">guide</a>
  <header>
    <div class="brand-row">
      <a class="brand" href="/">openOODA</a>
      <span class="ver">v0.204.0-beta</span>
    </div>
    <button type="button" id="theme">dark</button>
  </header>
  <div class="wrap">
    <aside>
      <nav class="global">
        <a href="/">home</a>
        <a href="/guide/">guide</a>
        <a href="https://registry.openooda.org/">store</a>
      </nav>
      <a id="gh" href="https://github.com/openOODA">github</a>
    </aside>
    <div class="col">
    <main>
      <p>Not found.</p>
    </main>
    <footer>
      <form class="mail" id="mail" action="https://collect.openooda.org/v1/emails" method="post">
        <p class="note">Join the mail list</p>
        <input type="email" name="email" placeholder="you@host" autocomplete="email" required>
        <input class="hp" type="text" name="website" tabindex="-1" autocomplete="off">
        <button type="submit" id="join">join</button>
      </form>
    </footer>
    </div>
  </div>
  <script>
    (function () {
      var key = "ooda-theme";
      function apply(t) {
        document.documentElement.setAttribute("data-theme", t);
        var b = document.getElementById("theme");
        if (b) b.textContent = t === "dark" ? "light" : "dark";
      }
      apply(document.documentElement.getAttribute("data-theme") || "light");
      var b = document.getElementById("theme");
      if (b) b.onclick = function () {
        var n = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
        localStorage.setItem(key, n);
        document.cookie = key + "=" + n + ";path=/;domain=.openooda.org;max-age=31536000;SameSite=Lax";
        apply(n);
      };
      var mail = document.getElementById("mail");
      if (mail) mail.addEventListener("submit", function (ev) {
        ev.preventDefault();
        var btn = document.getElementById("join");
        var email = (mail.email && mail.email.value) || "";
        var website = (mail.website && mail.website.value) || "";
        function fail() {
          if (btn) { btn.textContent = "join"; btn.className = ""; }
        }
        function ok() {
          if (btn) { btn.textContent = "joined"; btn.className = "is-on"; }
          if (mail.email) mail.email.value = "";
        }
        fetch("https://collect.openooda.org/v1/emails", {
          method: "POST",
          credentials: "omit",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: email, website: website, source: "404" })
        }).then(function (r) {
          if (r.ok) ok(); else fail();
        }).catch(fail);
      });
    })();
  </script>
</body>
</html>
