<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>openOODA</title>
  <meta name="description" content="openOODA — a language, a local package manager, and a public field guide.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <script>
    (function () {
      var m = document.cookie.match(/(?:^|; )ooda-theme=([^;]*)/);
      var t = (m && m[1] === "dark") || (typeof localStorage !== "undefined" && localStorage.getItem("ooda-theme") === "dark") ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <style>
    :root { --bg: #fff; --fg: #000; --muted: #444; }
    html[data-theme="dark"] { --bg: #000; --fg: #e8e8e8; --muted: #9a9a9a; }
    html { background: var(--bg); color: var(--fg); }
    body {
      margin: 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 16px;
      line-height: 1.5;
    }
    header {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 0.75rem 1.25rem; padding: 0.85rem 1.25rem; border-bottom: 2px solid var(--fg);
    }
    .brand {
      font-weight: 700; letter-spacing: 0.08em; color: var(--bg);
      background: var(--fg); padding: 0.2rem 0.45rem; text-decoration: none; white-space: nowrap;
    }
    .cluster { display: flex; align-items: center; gap: 1rem; flex-wrap: nowrap; }
    nav.top { display: flex; align-items: center; gap: 1rem; flex-wrap: nowrap; }
    nav.top a { color: var(--muted); white-space: nowrap; }
    #theme {
      font: inherit; background: var(--bg); color: var(--fg);
      border: 2px solid var(--fg); padding: 0.15rem 0.55rem; cursor: pointer; white-space: nowrap;
    }
    main { max-width: 44rem; padding: 1.5rem 1.25rem 5rem; }
    p { margin: 1.25rem 0; max-width: 36rem; }
    pre {
      margin: 0 0 2rem; padding: 0.6rem 0.7rem;
      border: 1px solid var(--fg); overflow: auto;
    }
    dl { margin: 0; display: grid; grid-template-columns: 9ch 1fr; gap: 0.4rem 1rem; align-items: baseline; }
    dt { color: var(--muted); }
    dd { margin: 0; overflow-wrap: anywhere; }
    a { color: var(--fg); }
    a:hover { text-decoration-thickness: 2px; }
    #gh { position: fixed; right: 1rem; bottom: 1rem; z-index: 20; color: var(--fg); background: var(--bg); padding: 0.15rem 0.35rem; }
    @media (max-width: 800px) {
      .cluster { flex-basis: 100%; }
    }
  </style>
</head>
<body>
  <a id="gh" href="https://github.com/openOODA">github</a>
  <header>
    <a class="brand" href="/">openOODA</a>
    <div class="cluster">
      <nav class="top">
        <a href="https://openooda.org/">site</a>
        <a href="https://openooda.org/guide/">guide</a>
        <a href="https://openooda.org/research/">research</a>
        <a href="https://registry.openooda.org/">registry</a>
      </nav>
      <button type="button" id="theme">dark</button>
    </div>
  </header>
  <main>
    <p>Language. Package manager. Field guide.</p>
    <pre>curl -fsSL https://openooda.org/install | sh</pre>
    <dl>
      <dt>guide</dt>
      <dd><a href="https://openooda.org/guide/">https://openooda.org/guide/</a></dd>
      <dt>research</dt>
      <dd><a href="https://openooda.org/research/">https://openooda.org/research/</a></dd>
      <dt>registry</dt>
      <dd><a href="https://registry.openooda.org/">https://registry.openooda.org/</a></dd>
    </dl>
  </main>
  <script>
    (function () {
      var key = "ooda-theme";
      function apply(t) {
        document.documentElement.setAttribute("data-theme", t);
        var b = document.getElementById("theme");
        if (b) b.textContent = t === "dark" ? "light" : "dark";
      }
      apply(document.documentElement.getAttribute("data-theme") || "light");
      var b = document.getElementById("theme");
      if (b) b.onclick = function () {
        var n = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
        localStorage.setItem(key, n);
        document.cookie = key + "=" + n + ";path=/;domain=.openooda.org;max-age=31536000;SameSite=Lax";
        apply(n);
      };
    })();
  </script>
</body>
</html>
