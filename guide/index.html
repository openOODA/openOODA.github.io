<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>openOODA guide</title>
  <link rel="canonical" href="https://openooda.org/guide/">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="description" content="openOODA user wiki — language, commands, packages, and capabilities.">
  <meta property="og:title" content="openOODA guide">
  <meta property="og:description" content="openOODA user wiki — language, commands, packages, and capabilities.">
  <meta property="og:url" content="https://openooda.org/guide/">
  <meta property="og:image" content="https://openooda.org/og.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    (function () {
      var THEMES = ["night", "paper", "magma", "flare", "solar", "cyber", "frost", "tokyo", "laser"];
      var m = document.cookie.match(/(?:^|; )ooda-theme=([^;]*)/);
      var stored = (m && m[1]) || (typeof localStorage !== "undefined" && localStorage.getItem("ooda-theme"));
      var t = (stored && THEMES.indexOf(stored) !== -1) ? stored : "night";
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <style>
    :root { --bg: #000000; --fg: #e8e8e8; --muted: #9a9a9a; --panel: #141414; --next-bg: #ffffff; --next-fg: #000000; }
    html[data-theme="night"] { --bg: #000000; --fg: #e8e8e8; --muted: #9a9a9a; --panel: #141414; --next-bg: #ffffff; --next-fg: #000000; }
    html[data-theme="paper"] { --bg: #ffffff; --fg: #000000; --muted: #444444; --panel: #f2f2f2; --next-bg: #140d0f; --next-fg: #ff6b6b; }
    html[data-theme="magma"] { --bg: #140d0f; --fg: #ff6b6b; --muted: #a34848; --panel: #221216; --next-bg: #181008; --next-fg: #ffa726; }
    html[data-theme="flare"] { --bg: #181008; --fg: #ffa726; --muted: #a86520; --panel: #26170a; --next-bg: #002b36; --next-fg: #ffd166; }
    html[data-theme="solar"] { --bg: #002b36; --fg: #ffd166; --muted: #93a1a1; --panel: #073642; --next-bg: #040a06; --next-fg: #00ff66; }
    html[data-theme="cyber"] { --bg: #040a06; --fg: #00ff66; --muted: #008833; --panel: #08170c; --next-bg: #16202a; --next-fg: #80ffea; }
    html[data-theme="frost"] { --bg: #16202a; --fg: #80ffea; --muted: #5c8d99; --panel: #1f2d3a; --next-bg: #1a1b26; --next-fg: #7dcfff; }
    html[data-theme="tokyo"] { --bg: #1a1b26; --fg: #7dcfff; --muted: #565f89; --panel: #24283b; --next-bg: #18122b; --next-fg: #ea047e; }
    html[data-theme="laser"] { --bg: #18122b; --fg: #ea047e; --muted: #8b5cf6; --panel: #251b3d; --next-bg: #000000; --next-fg: #e8e8e8; }
    html { background: var(--bg); color: var(--fg); height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 16px;
      line-height: 1.5;
    }
    #sky {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      pointer-events: none; z-index: 0;
    }
    header, .wrap { position: relative; z-index: 1; }
    @media (prefers-reduced-motion: reduce) {
      #sky { display: none; }
    }
    @media print {
      #sky { display: none !important; }
    }
    a { color: var(--fg); }
    a:hover { text-decoration-thickness: 2px; }
    header {
      position: sticky; top: 0; z-index: 10;
      background: transparent;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 0.75rem 1.25rem; padding: 0.85rem 1.25rem; border-bottom: 2px solid var(--fg);
    }
    .brand-row { display: flex; align-items: baseline; gap: 0.45rem; }
    .brand {
      font-weight: 700; letter-spacing: 0.08em; color: var(--bg);
      background: var(--fg); padding: 0.2rem 0.45rem; text-decoration: none; white-space: nowrap;
    }
    .ver { font-size: 0.85rem; white-space: nowrap; color: var(--fg); text-decoration: none; }
    .ver:hover { text-decoration: underline; text-decoration-thickness: 2px; }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .mail-header {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      margin: 0;
    }
    .mail-header input[type="email"] {
      font: inherit;
      background: transparent;
      color: var(--fg);
      border: 2px solid var(--fg);
      padding: 0.2rem 0.65rem;
      width: 30ch;
      min-width: 0;
      box-sizing: border-box;
      font-size: 0.85rem;
    }
    .mail-header input[type="email"]::placeholder {
      color: var(--muted);
      font-size: 0.8rem;
    }
    .mail-header #join {
      font: inherit;
      background: var(--bg);
      color: var(--fg);
      border: 2px solid var(--fg);
      padding: 0.2rem 0.65rem;
      cursor: pointer;
      white-space: nowrap;
      min-width: 5ch;
      text-align: center;
      box-sizing: border-box;
      font-size: 0.85rem;
    }
    .mail-header #join.is-on {
      background: var(--fg);
      color: var(--bg);
    }
    .mail-header .hp {
      position: absolute;
      left: -9999px;
      width: 1px;
      height: 1px;
      overflow: hidden;
    }
    .wrap { display: grid; grid-template-columns: 12rem 1fr; max-width: 60rem; flex: 1 0 auto; }
    .col { display: flex; flex-direction: column; min-width: 0; }
    aside {
      border-right: 1px solid var(--fg); padding: 1.25rem 1rem 5rem;
      position: sticky; top: 3.4rem; align-self: start;
      max-height: calc(100vh - 3.4rem); overflow: auto;
    }
    .global a, .local a { display: block; color: var(--fg); padding: 0.25rem 0; text-align: left; }
    .global a.active, .local a.active { text-decoration: underline; text-decoration-thickness: 2px; }
    .local { margin-top: 0.75rem; padding-top: 0.75rem; border-top: 1px solid var(--fg); }
    .local a { padding-left: 0.75rem; }
    main { padding: 1.5rem 1.25rem 1.5rem; max-width: 44rem; flex: 1 0 auto; }
    #page h1 { font-size: 1.1rem; margin: 0 0 0.75rem; }
    #page h2 { font-size: 1rem; margin: 1.5rem 0 0.5rem; }
    table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
    th, td { border: 1px solid var(--fg); padding: 0.35rem 0.5rem; text-align: left; vertical-align: top; }
    th { color: var(--muted); font-weight: 400; }
    pre, code { font-family: inherit; font-size: 0.9rem; }
    pre { border: 1px solid var(--fg); padding: 0.7rem; overflow: auto; background: var(--panel); }
    code { background: var(--panel); padding: 0.05rem 0.25rem; }
    pre code { background: none; padding: 0; }
    .canon { color: var(--muted); font-size: 0.85rem; }
    .err { color: var(--fg); }
    #theme {
      position: fixed; right: 1rem; bottom: 1rem; z-index: 20;
      font: inherit; background: var(--next-bg); color: var(--next-fg);
      border: 2px solid var(--next-fg); padding: 0.15rem 0.55rem; cursor: pointer; white-space: nowrap;
    }
    #skip {
      position: absolute; left: 0.5rem; top: 0.5rem; z-index: 30;
      background: var(--bg); color: var(--fg); padding: 0.15rem 0.45rem;
      clip-path: inset(50%); width: 1px; height: 1px; overflow: hidden;
    }
    #skip:focus {
      clip-path: none; width: auto; height: auto; overflow: visible;
      outline: 2px solid var(--fg);
    }
    @media (max-width: 800px) {
      body { font-size: 14.5px; }
      header { padding: 0.75rem 1rem; }
      .wrap { grid-template-columns: 1fr; width: 100%; }
      aside {
        position: static;
        max-height: none;
        border-right: 0;
        border-bottom: 1px solid var(--fg);
        padding: 0.75rem 1rem;
      }
      .global {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem 1.25rem;
        margin-bottom: 0.75rem;
      }
      .global a {
        display: inline-block;
        padding: 0.25rem 0;
        min-height: auto;
      }
      .local {
        display: flex;
        flex-wrap: wrap;
        gap: 0.35rem 0.5rem;
      }
      .local a {
        display: inline-block;
        font-size: 0.85rem;
        padding: 0.25rem 0.55rem;
        border: 1px solid var(--fg);
        background: var(--panel);
        text-decoration: none;
        min-height: auto;
        white-space: nowrap;
      }
      .local a.active {
        background: var(--fg);
        color: var(--bg);
        text-decoration: none;
      }
      #theme { min-height: 44px; }
      main, #page {
        padding: 1.25rem 1rem;
      }
      .mail-header input[type="email"] {
        min-height: 38px;
        padding: 0.4rem 0.6rem;
      }
      .mail-header #join {
        min-height: 38px;
        padding: 0.4rem 0.75rem;
      }
      pre {
        -webkit-overflow-scrolling: touch;
      }
      table {
        display: block;
        width: 100%;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }
    }
    @media (max-width: 480px) {
      body { font-size: 13.5px; }
      header { padding: 0.65rem 0.85rem; gap: 0.5rem; }
      .header-actions { width: 100%; justify-content: space-between; }
      .mail-header { flex: 1; }
      .mail-header input[type="email"] { flex: 1; width: 100%; min-height: 36px; }
      .mail-header #join { min-height: 36px; }
      #theme { min-height: 44px; }
      main, #page { padding: 1rem 0.85rem; }
    }
    @media print {
      html, body { background: #fff; color: #000; }
      #skip, #gh, #theme, header, aside, .mail-header { display: none !important; }
      .wrap, .col { display: block; max-width: none; }
      main, #page { padding: 0; max-width: none; }
      a { color: #000; }
      pre, code { background: none; }
    }
  </style>
</head>
<body>
  <a id="skip" href="#page">guide</a>
  <header>
    <div class="brand-row">
      <a class="brand" href="/">openOODA</a>
      <a class="ver" href="https://github.com/openOODA/ooda/releases" title="GitHub release notes">v0.210.0</a>
    </div>
    <div class="header-actions">
      <form class="mail-header" id="mail" action="https://collect.openooda.org/v1/emails" method="post">
        <input type="email" name="email" placeholder="engineering dispatches" autocomplete="email" required>
        <input class="hp" type="text" name="website" tabindex="-1" autocomplete="off">
        <button type="submit" id="join">join</button>
      </form>
    </div>
  </header>
  <div class="wrap">
    <aside>
      <nav class="global">
        <a href="/">home</a>
        <a class="active" href="/guide/">guide</a>
        <a href="https://registry.openooda.org/">store</a>
        <a id="gh" href="https://github.com/openOODA">github</a>
      </nav>
      <nav class="local">
        <a href="Home.oot" data-page="Home.oot">what it is</a>
        <a href="Use.oot" data-page="Use.oot">start</a>
        <a href="Language.oot" data-page="Language.oot">language</a>
        <a href="Options.oot" data-page="Options.oot">commands</a>
        <a href="Packages.oot" data-page="Packages.oot">packages</a>
        <a href="Safety.oot" data-page="Safety.oot">capabilities</a>
        <a href="Morpher.oot" data-page="Morpher.oot">active defense</a>
        <a href="Limits.oot" data-page="Limits.oot">how it works</a>
        <a href="Pay.oot" data-page="Pay.oot">pay / 402</a>
        <a href="QA.oot" data-page="QA.oot">verification</a>
        <a href="QuickRef.oot" data-page="QuickRef.oot">quickref</a>
      </nav>
      <div class="ai-snippets" style="margin-top: 1rem; padding-top: 0.75rem; border-top: 1px solid var(--fg);">
        <div style="font-size: 0.8rem; color: var(--muted); margin-bottom: 0.4rem;">1-click ai setup</div>
        <div style="display: flex; flex-direction: column; gap: 0.35rem;">
          <button type="button" class="ai-copy-btn" data-snippet="cursor" style="font: inherit; font-size: 0.8rem; background: var(--panel); color: var(--fg); border: 1px solid var(--fg); padding: 0.2rem 0.4rem; cursor: pointer; text-align: left;">copy .cursorrules</button>
          <button type="button" class="ai-copy-btn" data-snippet="claude" style="font: inherit; font-size: 0.8rem; background: var(--panel); color: var(--fg); border: 1px solid var(--fg); padding: 0.2rem 0.4rem; cursor: pointer; text-align: left;">copy CLAUDE.md</button>
          <button type="button" class="ai-copy-btn" data-snippet="windsurf" style="font: inherit; font-size: 0.8rem; background: var(--panel); color: var(--fg); border: 1px solid var(--fg); padding: 0.2rem 0.4rem; cursor: pointer; text-align: left;">copy .windsurfrules</button>
          <button type="button" class="ai-copy-btn" data-snippet="agents" style="font: inherit; font-size: 0.8rem; background: var(--panel); color: var(--fg); border: 1px solid var(--fg); padding: 0.2rem 0.4rem; cursor: pointer; text-align: left;">copy AGENTS.oot</button>
        </div>
      </div>
    </aside>
    <div class="col">
    <main>
      <div id="page" tabindex="-1">
      <noscript>
        <p class="canon">https://openooda.org/guide/</p>
        <p>User wiki. Open a page:</p>
        <ul>
          <li><a href="Home.oot">what it is</a></li>
          <li><a href="Use.oot">start</a></li>
          <li><a href="Language.oot">language</a></li>
          <li><a href="Options.oot">commands</a></li>
          <li><a href="Packages.oot">packages</a></li>
          <li><a href="Safety.oot">capabilities</a></li>
          <li><a href="Morpher.oot">active defense</a></li>
          <li><a href="Limits.oot">how it works</a></li>
          <li><a href="Pay.oot">pay / 402</a></li>
          <li><a href="QA.oot">verification</a></li>
          <li><a href="QuickRef.oot">quickref</a></li>
        </ul>
      </noscript>
      </div>
    </main>
    </div>
  </div>
  <button type="button" id="theme">dark</button>
  <script>
    const PAGES = ["Home.oot", "Use.oot", "Language.oot", "Options.oot", "Packages.oot", "Safety.oot", "Morpher.oot", "Limits.oot", "Pay.oot", "QA.oot", "QuickRef.oot"];
    const root = document.getElementById("page");
    function currentPage() {
      const h = (location.hash || "#Use.oot").replace(/^#/, "");
      return PAGES.includes(h) ? h : "Use.oot";
    }
    function wikiLinks(md) {
      const kept = md.split("\n").filter((line) => {
        return !/^File:\s/.test(line) && !/^User wiki\./.test(line);
      });
      return kept.join("\n").replace(/\]\(([A-Za-z]+\.oot)\)/g, "](#$1)");
    }
    async function show() {
      const name = currentPage();
      document.querySelectorAll("aside a[data-page]").forEach((a) => {
        a.classList.toggle("active", a.dataset.page === name);
      });
      root.innerHTML = "<p>Loading…</p>";
      try {
        const res = await fetch(name, { cache: "no-cache" });
        if (!res.ok) throw new Error(name + " " + res.status);
        const text = await res.text();
        root.innerHTML = '<p class="canon">https://openooda.org/guide/#' + name + "</p>" +
          marked.parse(wikiLinks(text));
      } catch (e) {
        root.innerHTML = '<p class="err">Could not load ' + name + ".</p>";
      }
    }
    document.querySelectorAll("aside a[data-page]").forEach((a) => {
      a.addEventListener("click", (e) => {
        e.preventDefault();
        location.hash = a.dataset.page;
      });
    });
    window.addEventListener("hashchange", show);
    if (!location.hash) location.replace("#Use.oot");
    else show();
    (function () {
      var key = "ooda-theme";
      var THEMES = ["night", "paper", "magma", "flare", "solar", "cyber", "frost", "tokyo", "laser"];
      function apply(t) {
        if (THEMES.indexOf(t) === -1) t = "night";
        document.documentElement.setAttribute("data-theme", t);
        var b = document.getElementById("theme");
        if (b) {
          var nextIdx = (THEMES.indexOf(t) + 1) % THEMES.length;
          b.textContent = THEMES[nextIdx];
        }
      }
      apply(document.documentElement.getAttribute("data-theme") || "night");
      var b = document.getElementById("theme");
      if (b) b.onclick = function () {
        var cur = document.documentElement.getAttribute("data-theme") || "night";
        var nextIdx = (THEMES.indexOf(cur) + 1) % THEMES.length;
        var n = THEMES[nextIdx];
        localStorage.setItem(key, n);
        document.cookie = key + "=" + n + ";path=/;domain=.openooda.org;max-age=31536000;SameSite=Lax";
        apply(n);
      };
      var mail = document.getElementById("mail");
      if (mail) mail.addEventListener("submit", function (ev) {
        ev.preventDefault();
        var btn = document.getElementById("join");
        var email = (mail.email && mail.email.value) || "";
        var website = (mail.website && mail.website.value) || "";
        function fail() {
          if (btn) { btn.textContent = "join"; btn.className = ""; }
        }
        function ok() {
          if (btn) { btn.textContent = "joined"; btn.className = "is-on"; }
          if (mail.email) mail.email.value = "";
        }
        fetch("https://collect.openooda.org/v1/emails", {
          method: "POST",
          credentials: "omit",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: email, website: website, source: "guide" })
        }).then(function (r) {
          if (r.ok) ok(); else fail();
        }).catch(fail);
      });
    })();
    (function () {
      var SNIPPETS = {
        cursor: "# openOODA AI Editor Rules\n1. Always use .oo file extension for code and .oot for documentation.\n2. Every .oo file must have a 4-element Academy header (Title, Logline, Setup, Beats).\n3. Strict <= 256 lines per file constraint.\n4. Mandatory explicit type annotations on every let statement (e.g. let x: Int = 0;).\n5. Zero trailing commas in struct definitions and struct literals.\n6. Return Result[T, String] with Err(\"...\") on failure; never panic.\n",
        claude: "# CLAUDE.md - openOODA Project Instructions\n\n## Syntax Laws\n- Extension: `.oo` for code, `.oot` for documentation.\n- Header: 4-element Academy header required on all source files.\n- Line limit: strictly <= 256 lines per file.\n- Types: Always explicit `let x: Type = val;`.\n- Structs: No trailing commas in fields or initializers.\n",
        windsurf: "# openOODA Windsurf Rules\n1. Pure .oo for executable logic; pure .oot for specifications.\n2. Mandatory 4-element Academy headers on all .oo source files.\n3. Maximum file budget: <= 256 lines.\n4. Strict explicit type annotations on every let.\n5. Zero struct trailing commas.\n",
        agents: "# AGENTS.oot - Universal Autonomous AI Engineering Manual\n\nLogline: Zero-trust operating instructions for autonomous AI agents authoring openOODA systems.\n\nSetup: Follow all rules fail-closed. Never produce unverified code.\n\nBeats:\n  1. Pure .oo source files (<= 256 lines).\n  2. 4-Element Academy headers on every file.\n  3. Explicit type annotations on all variable bindings.\n  4. Zero trailing commas in structs.\n"
      };
      document.querySelectorAll(".ai-copy-btn").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var key = btn.getAttribute("data-snippet");
          var text = SNIPPETS[key] || "";
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(function () {
              var orig = btn.textContent;
              btn.textContent = "copied!";
              setTimeout(function () { btn.textContent = orig; }, 1500);
            }).catch(function () {
              btn.textContent = "error";
            });
          }
        });
      });

      (function () {
        var canvas = document.createElement("canvas");
        canvas.id = "sky";
        canvas.setAttribute("aria-hidden", "true");
        document.body.prepend(canvas);
        var ctx = canvas.getContext("2d");
        if (!ctx) return;
        var stars = [];
        var dpr = window.devicePixelRatio || 1;
        function resize() {
          dpr = window.devicePixelRatio || 1;
          var w = window.innerWidth;
          var h = window.innerHeight;
          canvas.width = w * dpr;
          canvas.height = h * dpr;
          canvas.style.width = w + "px";
          canvas.style.height = h + "px";
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          initStars(w, h);
        }
        function initStars(w, h) {
          stars = [];
          var total = Math.max(35, Math.min(85, Math.floor((w * h) / 18000)));
          for (var i = 0; i < total; i++) {
            stars.push({
              x: Math.random() * w,
              y: Math.random() * h,
              size: Math.random() > 0.75 ? 2 : 1,
              flare: Math.random() > 0.45,
              flareLen: Math.floor(Math.random() * 5) + 4,
              phase: Math.random() * Math.PI * 2,
              speed: 0.006 + Math.random() * 0.012,
              maxAlpha: 0.35 + Math.random() * 0.55
            });
          }
        }
        function hexToRgb(hex) {
          hex = (hex || "").trim();
          if (hex.charAt(0) === "#") {
            if (hex.length === 4) {
              return [parseInt(hex[1]+hex[1], 16), parseInt(hex[2]+hex[2], 16), parseInt(hex[3]+hex[3], 16)];
            } else if (hex.length >= 7) {
              return [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
            }
          }
          return [232, 232, 232];
        }
        var curRgb = [232, 232, 232];
        function updateThemeColor() {
          var style = getComputedStyle(document.documentElement);
          var fg = style.getPropertyValue("--fg") || "#e8e8e8";
          curRgb = hexToRgb(fg);
        }
        function draw() {
          var w = window.innerWidth;
          var h = window.innerHeight;
          ctx.clearRect(0, 0, w, h);
          var r = curRgb[0], g = curRgb[1], b = curRgb[2];
          for (var i = 0; i < stars.length; i++) {
            var s = stars[i];
            s.phase += s.speed;
            var alpha = (Math.sin(s.phase) * 0.5 + 0.5) * s.maxAlpha;
            if (alpha <= 0.02) continue;
            var x = Math.floor(s.x);
            var y = Math.floor(s.y);
            ctx.fillStyle = "rgba(" + r + "," + g + "," + b + "," + alpha.toFixed(3) + ")";
            ctx.fillRect(x, y, s.size, s.size);
            if (s.flare && alpha > 0.22) {
              var fl = s.flareLen;
              var fa = (alpha * 0.45).toFixed(3);
              ctx.fillStyle = "rgba(" + r + "," + g + "," + b + "," + fa + ")";
              ctx.fillRect(x - fl, y, fl * 2 + s.size, 1);
              ctx.fillRect(x, y - fl, 1, fl * 2 + s.size);
              if (s.size > 1 && alpha > 0.45) {
                ctx.fillStyle = "rgba(" + r + "," + g + "," + b + "," + (alpha * 0.8).toFixed(3) + ")";
                ctx.fillRect(x - 1, y, s.size + 2, 1);
                ctx.fillRect(x, y - 1, 1, s.size + 2);
              }
            }
          }
          requestAnimationFrame(draw);
        }
        window.addEventListener("resize", resize);
        var observer = new MutationObserver(updateThemeColor);
        observer.observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
        resize();
        updateThemeColor();
        draw();
      })();
    })();
  </script>
</body>
</html>
