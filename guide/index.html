<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>openOODA guide</title>
  <link rel="canonical" href="https://openooda.org/guide/">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="description" content="openOODA user wiki — language, commands, packages, and capabilities.">
  <meta property="og:title" content="openOODA guide">
  <meta property="og:description" content="openOODA user wiki — language, commands, packages, and capabilities.">
  <meta property="og:url" content="https://openooda.org/guide/">
  <meta property="og:image" content="https://openooda.org/og.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    (function () {
      var m = document.cookie.match(/(?:^|; )ooda-theme=([^;]*)/);
      var t = (m && m[1] === "dark") || (typeof localStorage !== "undefined" && localStorage.getItem("ooda-theme") === "dark") ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <style>
    :root { --bg: #fff; --fg: #000; --muted: #444; --panel: #f2f2f2; }
    html[data-theme="dark"] { --bg: #000; --fg: #e8e8e8; --muted: #9a9a9a; --panel: #141414; }
    html { background: var(--bg); color: var(--fg); }
    body {
      margin: 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 16px;
      line-height: 1.5;
    }
    a { color: var(--fg); }
    a:hover { text-decoration-thickness: 2px; }
    header {
      position: sticky; top: 0; z-index: 10; background: var(--bg);
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 0.75rem 1.25rem; padding: 0.85rem 1.25rem; border-bottom: 2px solid var(--fg);
    }
    .brand-row { display: flex; align-items: baseline; gap: 0.45rem; }
    .brand {
      font-weight: 700; letter-spacing: 0.08em; color: var(--bg);
      background: var(--fg); padding: 0.2rem 0.45rem; text-decoration: none; white-space: nowrap;
    }
    .ver { font-size: 0.85rem; white-space: nowrap; }
    #theme {
      font: inherit; background: var(--bg); color: var(--fg);
      border: 2px solid var(--fg); padding: 0.15rem 0.55rem; cursor: pointer; white-space: nowrap;
    }
    .wrap { display: grid; grid-template-columns: 12rem 1fr; max-width: 60rem; }
    aside {
      border-right: 1px solid var(--fg); padding: 1.25rem 1rem 5rem;
      position: sticky; top: 3.4rem; align-self: start;
      max-height: calc(100vh - 3.4rem); overflow: auto;
    }
    .global a, .local a { display: block; color: var(--fg); padding: 0.25rem 0; text-align: left; }
    .global a.active, .local a.active { text-decoration: underline; text-decoration-thickness: 2px; }
    .local { margin-top: 0.75rem; padding-top: 0.75rem; border-top: 1px solid var(--fg); }
    .local a { padding-left: 0.75rem; }
    main#page { padding: 1.5rem 1.25rem 5rem; max-width: 44rem; }
    main#page h1 { font-size: 1.1rem; margin: 0 0 0.75rem; }
    main#page h2 { font-size: 1rem; margin: 1.5rem 0 0.5rem; }
    table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
    th, td { border: 1px solid var(--fg); padding: 0.35rem 0.5rem; text-align: left; vertical-align: top; }
    th { color: var(--muted); font-weight: 400; }
    pre, code { font-family: inherit; font-size: 0.9rem; }
    pre { border: 1px solid var(--fg); padding: 0.7rem; overflow: auto; background: var(--panel); }
    code { background: var(--panel); padding: 0.05rem 0.25rem; }
    pre code { background: none; padding: 0; }
    .canon { color: var(--muted); font-size: 0.85rem; }
    .err { color: var(--fg); }
    #gh { position: fixed; right: 1rem; bottom: 1rem; z-index: 20; color: var(--fg); background: var(--bg); padding: 0.15rem 0.35rem; }
    #skip {
      position: absolute; left: 0.5rem; top: 0.5rem; z-index: 30;
      background: var(--bg); color: var(--fg); padding: 0.15rem 0.45rem;
      clip-path: inset(50%); width: 1px; height: 1px; overflow: hidden;
    }
    #skip:focus {
      clip-path: none; width: auto; height: auto; overflow: visible;
      outline: 2px solid var(--fg);
    }
    @media (max-width: 800px) {
      .wrap { grid-template-columns: 1fr; }
      aside { position: static; max-height: none; border-right: 0; border-bottom: 1px solid var(--fg); padding-bottom: 1rem; }
      #gh {
        position: static; display: block;
        margin-top: 0.75rem; padding: 0.75rem 0 0;
        border-top: 1px solid var(--fg);
      }
      #theme {
        min-height: 44px; padding: 0.55rem 0.85rem; box-sizing: border-box;
      }
      .global a, .local a {
        min-height: 44px; padding-top: 0.65rem; padding-bottom: 0.65rem; box-sizing: border-box;
      }
      main#page { padding-bottom: 1.5rem; }
    }
    @media print {
      html, body { background: #fff; color: #000; }
      #skip, #gh, #theme, header, aside { display: none !important; }
      .wrap { display: block; max-width: none; }
      main#page { padding: 0; max-width: none; }
      a { color: #000; }
      pre, code { background: none; }
    }
  </style>
</head>
<body>
  <a id="skip" href="#page">guide</a>
  <header>
    <div class="brand-row">
      <a class="brand" href="/">openOODA</a>
      <span class="ver">v0.203.0-beta</span>
    </div>
    <button type="button" id="theme">dark</button>
  </header>
  <div class="wrap">
    <aside>
      <nav class="global">
        <a href="/">home</a>
        <a class="active" href="/guide/">guide</a>
        <a href="https://registry.openooda.org/">registry</a>
      </nav>
      <nav class="local">
        <a href="Home.oot" data-page="Home.oot">what it is</a>
        <a href="Use.oot" data-page="Use.oot">start</a>
        <a href="Language.oot" data-page="Language.oot">language</a>
        <a href="Options.oot" data-page="Options.oot">commands</a>
        <a href="Packages.oot" data-page="Packages.oot">packages</a>
        <a href="Safety.oot" data-page="Safety.oot">capabilities</a>
        <a href="Limits.oot" data-page="Limits.oot">how it works</a>
      </nav>
      <a id="gh" href="https://github.com/openOODA">github</a>
    </aside>
    <main id="page" tabindex="-1">
      <noscript>
        <p class="canon">https://openooda.org/guide/</p>
        <p>User wiki. Open a page:</p>
        <ul>
          <li><a href="Home.oot">what it is</a></li>
          <li><a href="Use.oot">start</a></li>
          <li><a href="Language.oot">language</a></li>
          <li><a href="Options.oot">commands</a></li>
          <li><a href="Packages.oot">packages</a></li>
          <li><a href="Safety.oot">capabilities</a></li>
          <li><a href="Limits.oot">how it works</a></li>
        </ul>
      </noscript>
    </main>
  </div>
  <script>
    const PAGES = ["Home.oot", "Use.oot", "Language.oot", "Options.oot", "Packages.oot", "Safety.oot", "Limits.oot", "Research.oot"];
    const root = document.getElementById("page");
    function currentPage() {
      const h = (location.hash || "#Home.oot").replace(/^#/, "");
      return PAGES.includes(h) ? h : "Home.oot";
    }
    function wikiLinks(md) {
      const kept = md.split("\n").filter((line) => {
        return !/^File:\s/.test(line) && !/^User wiki\./.test(line);
      });
      return kept.join("\n").replace(/\]\(([A-Za-z]+\.oot)\)/g, "](#$1)");
    }
    async function show() {
      const name = currentPage();
      document.querySelectorAll("aside a[data-page]").forEach((a) => {
        a.classList.toggle("active", a.dataset.page === name);
      });
      root.innerHTML = "<p>Loading…</p>";
      try {
        const res = await fetch(name, { cache: "no-cache" });
        if (!res.ok) throw new Error(name + " " + res.status);
        const text = await res.text();
        root.innerHTML = '<p class="canon">https://openooda.org/guide/#' + name + "</p>" +
          marked.parse(wikiLinks(text));
      } catch (e) {
        root.innerHTML = '<p class="err">Could not load ' + name + ".</p>";
      }
    }
    document.querySelectorAll("aside a[data-page]").forEach((a) => {
      a.addEventListener("click", (e) => {
        e.preventDefault();
        location.hash = a.dataset.page;
      });
    });
    window.addEventListener("hashchange", show);
    if (!location.hash) location.replace("#Home.oot");
    else show();
    (function () {
      var key = "ooda-theme";
      function apply(t) {
        document.documentElement.setAttribute("data-theme", t);
        var b = document.getElementById("theme");
        if (b) b.textContent = t === "dark" ? "light" : "dark";
      }
      apply(document.documentElement.getAttribute("data-theme") || "light");
      var b = document.getElementById("theme");
      if (b) b.onclick = function () {
        var n = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
        localStorage.setItem(key, n);
        document.cookie = key + "=" + n + ";path=/;domain=.openooda.org;max-age=31536000;SameSite=Lax";
        apply(n);
      };
    })();
  </script>
</body>
</html>
