<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>openOODA research</title>
  <meta name="description" content="openOODA research library.">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    (function () {
      var m = document.cookie.match(/(?:^|; )ooda-theme=([^;]*)/);
      var t = (m && m[1] === "dark") || (typeof localStorage !== "undefined" && localStorage.getItem("ooda-theme") === "dark") ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <style>
    :root { --bg: #fff; --fg: #000; --muted: #444; --panel: #f2f2f2; }
    html[data-theme="dark"] { --bg: #000; --fg: #e8e8e8; --muted: #9a9a9a; --panel: #141414; }
    html { background: var(--bg); color: var(--fg); }
    body {
      margin: 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 16px;
      line-height: 1.5;
    }
    a { color: var(--fg); }
    a:hover { text-decoration-thickness: 2px; }
    header {
      position: sticky; top: 0; z-index: 10; background: var(--bg);
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 0.75rem 1.25rem; padding: 0.85rem 1.25rem; border-bottom: 2px solid var(--fg);
    }
    .brand-row { display: flex; align-items: baseline; gap: 0.45rem; }
    .brand {
      font-weight: 700; letter-spacing: 0.08em; color: var(--bg);
      background: var(--fg); padding: 0.2rem 0.45rem; text-decoration: none; white-space: nowrap;
    }
    .ver { font-size: 0.85rem; white-space: nowrap; color: var(--fg); text-decoration: none; }
    .ver:hover { text-decoration: underline; text-decoration-thickness: 2px; }
    #theme {
      position: fixed; right: 1rem; bottom: 1rem; z-index: 20;
      font: inherit; background: var(--bg); color: var(--fg);
      border: 2px solid var(--fg); padding: 0.15rem 0.55rem; cursor: pointer; white-space: nowrap;
    }
    .wrap { display: grid; grid-template-columns: 12rem 1fr; max-width: 60rem; }
    aside {
      display: flex; flex-direction: column;
      border-right: 1px solid var(--fg); padding: 1.25rem 1rem 1.25rem;
      position: sticky; top: 3.4rem; align-self: start;
      max-height: calc(100vh - 3.4rem);
    }
    .global a, .local a { display: block; color: var(--fg); padding: 0.25rem 0; text-align: left; }
    .global a.active, .local a.active { text-decoration: underline; text-decoration-thickness: 2px; }
    .local { margin-top: 0.75rem; padding-top: 0.75rem; border-top: 1px solid var(--fg); overflow: auto; }
    .local a { padding-left: 0.75rem; font-size: 0.85rem; overflow-wrap: anywhere; }
    .local h2 { font-size: 0.8rem; color: var(--muted); font-weight: 400; margin: 0.75rem 0 0.35rem; padding-left: 0.75rem; }
    main { padding: 1.5rem 1.25rem 5rem; max-width: 46rem; }
    main h1 { font-size: 1.15rem; }
    main h2 { font-size: 1rem; margin-top: 1.5rem; }
    pre { border: 1px solid var(--fg); padding: 0.7rem; overflow: auto; background: var(--panel); }
    code { font-family: inherit; background: var(--panel); padding: 0.05rem 0.25rem; }
    pre code { background: none; padding: 0; }
    #gh { color: var(--fg); }
    @media (max-width: 800px) {
      .wrap { grid-template-columns: 1fr; }
      aside { position: static; max-height: none; border-right: 0; border-bottom: 1px solid var(--fg); }
      .local { overflow: visible; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand-row">
      <a class="brand" href="/">openOODA</a>
      <a class="ver" href="https://github.com/openOODA/ooda/releases" title="GitHub release notes">v0.208.0</a>
    </div>
  </header>
  <div class="wrap">
    <aside>
      <nav class="global">
        <a href="/">home</a>
        <a href="/guide/">guide</a>
        <a href="https://registry.openooda.org/">registry</a>
        <a id="gh" href="https://github.com/openOODA">github</a>
      </nav>
      <nav class="local" id="nav-list"></nav>
    </aside>
    <main id="content"><p>Select a paper.</p></main>
  </div>
  <button type="button" id="theme">dark</button>
  <script>
    const papers = [{"file": "RP-1-1-philosophy-ooda-loop-speed.oot", "title": "RP-1.1: Philosophy of speed (OODA loop)"}, {"file": "RP-1-2-mathematical-contracts.oot", "title": "RP-1.2: Mathematical contracts (requires/ensures)"}, {"file": "RP-1-3-data-oriented-design-soa.oot", "title": "RP-1.3: Data-oriented design & SoA layout"}, {"file": "RP-1-4-first-class-ast-macros.oot", "title": "RP-1.4: First-class AST macros"}, {"file": "RP-1-5-compile-time-type-state.oot", "title": "RP-1.5: Compile-time type-state machines"}, {"file": "RP-2-1-surgical-ast-patching.oot", "title": "RP-2.1: Surgical AST Patching and JSON Diagnostics"}, {"file": "RP-2-2-token-minimized-apis.oot", "title": "RP-2.2: Token-Minimized APIs"}, {"file": "RP-2-2b-surgical-patch-replace-fn.oot", "title": "RP-2.2b: Surgical Function Replacement"}, {"file": "RP-2-3-intent-driven-compilation.oot", "title": "RP-2.3: Intent-Driven Compilation (Telepathic AST)"}, {"file": "RP-2-4-global-hive-mind-fuzzing.oot", "title": "RP-2.4: Global Hive-Mind Fuzzing"}, {"file": "RP-3-1-unified-capability-sandboxing.oot", "title": "RP-3.1: Unified Capability Sandboxing"}, {"file": "RP-3-10-shadow-state-semantic-reversion.oot", "title": "RP-3.10: Shadow-State Semantic Reversion"}, {"file": "RP-3-11-polymorphic-metamorphic-binaries.oot", "title": "RP-3.11: Polymorphic and Metamorphic Binaries"}, {"file": "RP-3-2-time-entropy-sandboxing.oot", "title": "RP-3.2: Time and Entropy Sandboxing for Deterministic Systems"}, {"file": "RP-3-3-memory-quotas-heap-sandbox.oot", "title": "RP-3.3: Memory Quotas (Heap Sandboxing)"}, {"file": "RP-3-4-cpu-quotas-maxcycles.oot", "title": "RP-3.4: CPU Quotas and Execution Sandboxing via the MaxCycles Attribute"}, {"file": "RP-3-5-static-taint-secret.oot", "title": "RP-3.5: Static Taint Tracking and Information-Flow Control"}, {"file": "RP-3-6-automated-contract-fuzzer.oot", "title": "RP-3.6: Automated Contract Fuzzer"}, {"file": "RP-3-7-zero-ms-gc-arc-raii.oot", "title": "RP-3.7: Zero Millisecond Garbage Collection and Memory Safety (ARC/RAII)"}, {"file": "RP-3-8-temporal-memory-rollback.oot", "title": "RP-3.8: Temporal Memory (State Rollback) for Resilient Agent Systems"}, {"file": "RP-3-9-cryptographic-call-graph-integrity.oot", "title": "RP-3.9: Theoretical Framework for Cryptographic Call-Graph Integrity in openOODA"}, {"file": "RP-4-1-1-development-bytecode-vm.oot", "title": "RP-4.1.1: Development Bytecode Virtual Machine"}, {"file": "RP-4-1-2-production-llvm.oot", "title": "RP-4.1.2: Production LLVM Backend Architecture"}, {"file": "RP-4-1-3-gpu-npu-acceleration.oot", "title": "RP-4.1.3: Universal GPU/NPU Acceleration Architecture"}, {"file": "RP-4-1-4-direct-webassembly.oot", "title": "RP-4.1.4: Direct WebAssembly"}, {"file": "RP-4-1-5-bare-metal-embedded.oot", "title": "RP-4.1.5: Bare-metal embedded (`#![no_std]`)"}, {"file": "RP-4-2-native-hot-code-reloading.oot", "title": "RP-4.2: Native Hot-Code Reloading for High-Availability Virtual Machines"}, {"file": "RP-4-3-1-cross-language-lto.oot", "title": "RP-4.3.1: Cross-language Link-Time Optimization (LTO)"}, {"file": "RP-4-3-2-deterministic-reproducible-builds.oot", "title": "RP-4.3.2: Deterministic reproducible builds"}, {"file": "RP-4-3-3-compile-time-ffi-generation.oot", "title": "RP-4.3.3: Compile-Time FFI Generation"}, {"file": "RP-4-4-holographic-data-persistence.oot", "title": "RP-4.4: Holographic data persistence"}, {"file": "RP-4-x-backend-c-product-floor.oot", "title": "RP-4.x: Backend-C Architecture"}, {"file": "RP-5-1-self-hosted-ecosystem.oot", "title": "RP-5.1: The Necessity of a Fully Self-Hosted Ecosystem in openOODA"}, {"file": "RP-5-1a-pure-product-compiler-cli.oot", "title": "RP-5.1a: Theoretical Design for a Pure Product Compiler and Command-Line Interface"}, {"file": "RP-5-2-verifiable-web-of-code.oot", "title": "RP-5.2: Verifiable Web of Code"}, {"file": "RP-5-3-fearless-concurrency.oot", "title": "RP-5.3: Fearless Concurrency"}, {"file": "RP-5-4-stdlib-core-vs-os.oot", "title": "RP-5.4: Standard Library Architecture: Core Versus Operating System Separation"}, {"file": "RP-5-5-narrative-diagnostics.oot", "title": "Narrative Diagnostics in Artificial Intelligence-Native Compilers"}, {"file": "RP-5-6-hitl-testing.oot", "title": "Human-in-the-Loop Testing for Artificial Intelligence-Native Languages"}, {"file": "RP-5-7-universal-native-lsp.oot", "title": "Universal Native Language Server Protocol Integration"}, {"file": "RP-6-1-tension-metamorphic-vs-deterministic.oot", "title": "The Boundary Policy: Resolving the Tension Between Metamorphic Binaries and Deterministic Builds"}, {"file": "RP-6-2-tension-arc-vs-temporal-memory.oot", "title": "Tension Resolution: Automatic Reference Counting versus Temporal Memory"}, {"file": "RP-6-3-tension-caps-vs-ffi.oot", "title": "Capability Sandboxing Versus Foreign Function Interfaces"}, {"file": "RP-ES-1-es-ai-native-systems-language.oot", "title": "Artificial Intelligence-Native Systems Language Architecture"}, {"file": "RP-ES-2-es-capability-secure.oot", "title": "Capability-Secure by Construction in Systems Languages"}, {"file": "RP-ES-3-es-self-testing.oot", "title": "RP-ES.3: Self-Testing Language Surface Architecture"}, {"file": "RP-ES-4-es-subsecond-feedback.oot", "title": "RP-ES.4: A Sub-Second Development Feedback Architecture for Continuous Verification"}, {"file": "RP-ES-5-es-zero-day-defense.oot", "title": "RP-ES.5: Zero-Day Defense Architecture"}, {"file": "RP-ES-6-es-scale-embedded-to-network.oot", "title": "RP-ES.6: Embedded to Global Verifiable Network Architecture"}];
    const navList = document.getElementById("nav-list");
    const contentArea = document.getElementById("content");
    function renderNav() {
      const groups = {
        "RP-ES": "executive summaries",
        "RP-1": "philosophy",
        "RP-2": "ai-native",
        "RP-3": "security",
        "RP-4": "backends",
        "RP-5": "ecosystem",
        "RP-6": "tensions"
      };
      let currentGroup = "";
      papers.forEach((p) => {
        const match = p.file.match(/RP-([A-Z0-9]+)/);
        const groupKey = match ? "RP-" + match[1] : "Other";
        if (groupKey !== currentGroup) {
          currentGroup = groupKey;
          const header = document.createElement("h2");
          header.textContent = groups[groupKey] || groupKey;
          navList.appendChild(header);
        }
        const a = document.createElement("a");
        a.href = "#" + p.file;
        a.dataset.file = p.file;
        a.textContent = p.title || p.file.replace("research/", "");
        navList.appendChild(a);
      });
    }
    function currentPaper() {
      const h = (location.hash || "").replace(/^#/, "");
      for (var i = 0; i < papers.length; i++) {
        if (papers[i].file === h) return papers[i];
      }
      return papers[0];
    }
    async function loadPaper(filePath) {
      contentArea.innerHTML = "<p>Loading…</p>";
      try {
        const response = await fetch(filePath);
        if (!response.ok) throw new Error("fetch");
        contentArea.innerHTML = marked.parse(await response.text());
      } catch (e) {
        contentArea.innerHTML = "<p>Could not load paper.</p>";
      }
    }
    function show() {
      const paper = currentPaper();
      document.querySelectorAll(".local a").forEach((link) => {
        link.classList.toggle("active", link.dataset.file === paper.file);
      });
      loadPaper(paper.file);
    }
    renderNav();
    window.addEventListener("hashchange", show);
    if (!location.hash) location.replace("#" + papers[0].file);
    else show();
    (function () {
      var key = "ooda-theme";
      function apply(t) {
        document.documentElement.setAttribute("data-theme", t);
        var b = document.getElementById("theme");
        if (b) b.textContent = t === "dark" ? "light" : "dark";
      }
      apply(document.documentElement.getAttribute("data-theme") || "light");
      var b = document.getElementById("theme");
      if (b) b.onclick = function () {
        var n = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
        localStorage.setItem(key, n);
        document.cookie = key + "=" + n + ";path=/;domain=.openooda.org;max-age=31536000;SameSite=Lax";
        apply(n);
      };
    })();
  </script>
</body>
</html>
