<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="observeToOrientIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="orientToDecideIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
    <linearGradient id="decideToActIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d946ef"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="actToObserveIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="iconGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Tile -->
  <rect width="200" height="200" rx="48" fill="#090d16"/>

  <!-- OODA Orbital Loop Badge -->
  <g transform="translate(100, 100)">
    <!-- Radar Rings -->
    <circle r="72" stroke="#1e293b" stroke-width="1.5" fill="none" stroke-dasharray="4 4"/>
    <circle r="56" stroke="#334155" stroke-width="1.5" fill="none"/>

    <!-- Interlocking Loops -->
    <path d="M 0 -56 A 56 56 0 0 1 56 0" stroke="url(#observeToOrientIcon)" stroke-width="4.5" fill="none" filter="url(#iconGlow)"/>
    <path d="M 56 0 A 56 56 0 0 1 0 56" stroke="url(#orientToDecideIcon)" stroke-width="4.5" fill="none" filter="url(#iconGlow)"/>
    <path d="M 0 56 A 56 56 0 0 1 -56 0" stroke="url(#decideToActIcon)" stroke-width="4.5" fill="none" filter="url(#iconGlow)"/>
    <path d="M -56 0 A 56 56 0 0 1 0 -56" stroke="url(#actToObserveIcon)" stroke-width="4.5" fill="none" filter="url(#iconGlow)"/>

    <!-- 4 Cardinal Nodes -->
    <circle cx="0" cy="-56" r="7" fill="#06b6d4" filter="url(#iconGlow)"/>
    <circle cx="0" cy="-56" r="3" fill="#ffffff"/>

    <circle cx="56" cy="0" r="7" fill="#8b5cf6" filter="url(#iconGlow)"/>
    <circle cx="56" cy="0" r="3" fill="#ffffff"/>

    <circle cx="0" cy="56" r="7" fill="#d946ef" filter="url(#iconGlow)"/>
    <circle cx="0" cy="56" r="3" fill="#ffffff"/>

    <circle cx="-56" cy="0" r="7" fill="#10b981" filter="url(#iconGlow)"/>
    <circle cx="-56" cy="0" r="3" fill="#ffffff"/>

    <!-- Central .oo Core -->
    <rect x="-28" y="-28" width="56" height="56" rx="14" fill="#0f172a" stroke="#6366f1" stroke-width="2"/>
    <text x="0" y="9" font-family="-apple-system, sans-serif" font-weight="900" font-size="26" fill="#ffffff" text-anchor="middle">.oo</text>
  </g>
</svg>
