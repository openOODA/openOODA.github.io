<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="100%" height="100%">
  <defs>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background container for dark theme rendering -->
  <rect width="600" height="160" rx="20" fill="#0f172a"/>

  <!-- Icon Badge -->
  <g transform="translate(30, 30)">
    <rect width="100" height="100" rx="24" fill="url(#badgeGrad)" filter="url(#glow)"/>
    <text x="50" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" fill="#ffffff" text-anchor="middle">.oo</text>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(155, 92)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="52" font-weight="800" letter-spacing="-1.5">
      <tspan fill="#6366f1">open</tspan><tspan fill="url(#textGrad)">OODA</tspan>
    </text>
    <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="#94a3b8" letter-spacing="2">
      CAPABILITY-SECURE SYSTEMS LANGUAGE
    </text>
  </g>
</svg>
